name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Araç zinciri
        run: swift --version
      - name: Test
        run: swift test
      - name: Uygulama paketi
        run: ./scripts/build-app.sh
      - name: Paket içeriğini doğrula
        run: |
          plutil -lint "build/Nabız.app/Contents/Info.plist"
          codesign --verify --verbose "build/Nabız.app"
